name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  host-tests:
    name: Host Unit Tests (no hardware)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bootloader
        uses: actions/checkout@v4
      - name: Install host toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc g++ make
      - name: Run host tests (P4 + S3)
        run: make -C host_test test

  build-and-test:
    name: Build Payload & Bootloader (${{ matrix.target }})
    # Using standard ubuntu-latest so we have access to Docker for both builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32p4
            board: WAVESHARE_ESP32_P4_WIFI6_TOUCH_LCD_43
            platform: seedsigner_esp32p4
            test_script: pytest_seedsigner_bootloader_p4_stateless_os.py
          - target: esp32s3
            board: WAVESHARE_ESP32_S3_TOUCH_LCD_35B
            platform: seedsigner_esp32s3
            test_script: pytest_seedsigner_bootloader_esp32s3_stateless_os.py

    steps:
      - name: Checkout Bootloader
        uses: actions/checkout@v4
        with:
          path: bootloader

      - name: Checkout MicroPython Builder
        uses: actions/checkout@v4
        with:
          repository: wolgwang1729/seedsigner-micropython-builder
          ref: esp32s3-stateless-boot
          path: micropython-builder
          submodules: recursive

      - name: Build MicroPython Payload (${{ matrix.target }})
        run: |
          cd micropython-builder
          # Initialize submodules for frozen app
          git submodule update --init deps/seedsigner deps/embit
          export SS_APP_DIR=$PWD/deps/seedsigner
          export SS_EMBIT_DIR=$PWD/deps/embit
          # The makefile uses docker internally
          make docker-build-all BOARD=${{ matrix.board }}

      - name: Upload MicroPython Payload (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: micropython-payload-${{ matrix.target }}
          path: micropython-builder/build/${{ matrix.board }}/micropython.bin
          if-no-files-found: error

      - name: Generate Keys, Sign Payload & Build Bootloader (${{ matrix.target }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/bootloader espressif/idf:v5.5.1 bash -c "
            . \$IDF_PATH/export.sh &&
            pip install ecdsa bech32 pytest pytest-embedded pytest-embedded-idf pytest-embedded-serial &&
            
            echo 'Generating Keys...' &&
            espsecure.py generate_signing_key --version 2 secure_boot_signing_key.pem &&
            python3 tools/generate_vendor_key.py --profile test &&
            
            echo 'Signing Payload...' &&
            python3 tools/generate_signed_payload.py \
              ../micropython-builder/build/${{ matrix.board }}/micropython.bin \
              ${{ matrix.platform }}.bin \
              --platform ${{ matrix.platform }} &&
            
            echo 'Building Bootloader for ${{ matrix.target }}...' &&
            idf.py set-target ${{ matrix.target }} &&
            idf.py build
          "

      - name: Upload Artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: complete-build-artifacts-${{ matrix.target }}
          path: |
            bootloader/build/bootloader/bootloader.bin
            bootloader/build/partition_table/partition-table.bin
            bootloader/build/seedsigner_secure_loader.bin
            bootloader/${{ matrix.platform }}.bin

      - name: Run Hardware Tests (${{ matrix.target }})
        continue-on-error: true
        run: |
          # Pytest requires a physical ESP32 device and the SD card payload.
          # We map /dev/ttyACM0 to the container if it exists.
          docker run --rm --device=/dev/ttyACM0 -v ${{ github.workspace }}:/workspace -w /workspace/bootloader espressif/idf:v5.5.1 bash -c "
            . \$IDF_PATH/export.sh &&
            pip install pytest pytest-embedded pytest-embedded-idf pytest-embedded-serial &&
            pytest -s --embedded-services esp,idf --target ${{ matrix.target }} ${{ matrix.test_script }}
          " || echo "Hardware tests skipped or failed due to missing ${{ matrix.target }} device / SD card."

  emulator-repl:
    name: Emulator REPL (${{ matrix.target }})
    # Boots the full stateless chain (Secure Boot V2 -> loader -> signed bundle)
    # in esp-emu and proves the MicroPython REPL evaluates injected commands.
    # Reuses the raw micropython.bin built by the job above (same run, same
    # bytes); the emulation-only pieces live in tools/emu/.
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32p4
            emu_target: p4
            board: WAVESHARE_ESP32_P4_WIFI6_TOUCH_LCD_43
          - target: esp32s3
            emu_target: s3
            board: WAVESHARE_ESP32_S3_TOUCH_LCD_35B

    steps:
      - name: Checkout Bootloader
        uses: actions/checkout@v4

      - name: Download MicroPython payload from the build job
        uses: actions/download-artifact@v4
        with:
          name: micropython-payload-${{ matrix.target }}
          path: payload

      - name: Install esp-emu (pinned)
        run: |
          curl -fsSL --retry 3 -o /tmp/esp-emu-install.sh \
            https://raw.githubusercontent.com/espressif/esp-emulator/v0.49.0/install.sh
          sh /tmp/esp-emu-install.sh --version 0.49.0 --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download ESP32-P4 rev0 ROM ELF (rev-1.3 route)
        if: matrix.emu_target == 'p4'
        run: |
          mkdir -p rom-elfs
          curl -fsSL --retry 3 -o /tmp/esp-rom-elfs.tar.gz \
            https://github.com/espressif/esp-rom-elfs/releases/download/20241011/esp-rom-elfs-20241011.tar.gz
          tar -xzf /tmp/esp-rom-elfs.tar.gz -C rom-elfs

      - name: Build loader + sign payload + merge emulator image (${{ matrix.target }})
        run: |
          IMG=$(find payload -name micropython.bin | head -1)
          [ -n "$IMG" ] || { echo "micropython.bin not found in payload artifact"; exit 1; }
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e SCRATCH=/workspace/emu-scratch \
            -e PAYLOAD_BIN="/workspace/$IMG" \
            espressif/idf:v5.5.1 bash -c '
              . $IDF_PATH/export.sh &&
              pip install -q ecdsa bech32 &&
              tools/emu/run_emu_ci.sh build ${{ matrix.emu_target }} &&
              chmod -R a+rwX /workspace/emu-scratch
            '

      - name: Boot in esp-emu and check MicroPython REPL (${{ matrix.target }})
        env:
          SCRATCH: ${{ github.workspace }}/emu-scratch
          P4_REV0_ROM: ${{ github.workspace }}/rom-elfs/esp32p4_rev0_rom.elf
        run: tools/emu/run_emu_ci.sh run ${{ matrix.emu_target }}

      - name: Upload emulator log (${{ matrix.target }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log-${{ matrix.target }}
          path: emu-scratch/emu_*.log
          if-no-files-found: ignore
